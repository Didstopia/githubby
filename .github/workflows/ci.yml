name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run tests
        shell: bash
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.txt
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.2

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Build
        run: go build -v ./...

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: docker build -t githubby:ci .

      - name: Smoke test — version
        run: docker run --rm githubby:ci version

      - name: Smoke test — git and git-lfs present
        run: |
          docker run --rm --entrypoint git githubby:ci --version
          docker run --rm --entrypoint git githubby:ci lfs version

      - name: Smoke test — sync help
        run: docker run --rm githubby:ci sync --help

      - name: Smoke test — runs as Unraid's nobody:users with no home
        run: |
          docker run --rm --user 99:100 githubby:ci version
          # Swap the binary for a probe: the real entrypoint must give it a writable HOME for git-lfs
          printf '#!/bin/sh\nset -e\ntouch "$HOME/.probe"\ngit lfs install\necho "HOME=$HOME"\n' > "$RUNNER_TEMP/probe"
          chmod +x "$RUNNER_TEMP/probe"
          docker run --rm --user 99:100 -v "$RUNNER_TEMP/probe:/githubby:ro" githubby:ci
          # No keychain in a container: auth status must answer, not hang
          rc=0; timeout 60 docker run --rm --user 99:100 githubby:ci auth status || rc=$?
          test "$rc" -ne 124
          # A checkout owned by another uid is still a usable repo
          docker run --rm --user 99:100 -v "$PWD:/src:ro" --entrypoint git githubby:ci -C /src status --short
